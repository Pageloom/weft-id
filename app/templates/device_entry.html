{% extends "base.html" %}

{% block title %}Connect a Device - {{ site_title }}{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-8">
            <h1 class="text-2xl font-semibold text-center mb-2 text-gray-900 dark:text-gray-100">Connect a device</h1>
            <p class="text-sm text-center text-gray-600 dark:text-gray-400 mb-6">Enter the code shown on your device.</p>

            {% if error %}
            <div id="device-error" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-gray-700 text-red-800 dark:text-red-300 px-4 py-3 rounded mb-6 text-sm" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/device">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="user_code" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Code</label>
                <input type="text" id="user_code" name="user_code" value="{{ user_code }}" maxlength="20" required
                       autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" autofocus
                       class="mt-1 block w-full border border-gray-300 dark:border-gray-600 rounded-md px-3 py-3 text-center text-2xl font-mono tracking-widest uppercase bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <button type="submit"
                        class="mt-6 w-full bg-blue-600 text-white py-3 px-4 rounded hover:bg-blue-700 font-semibold">
                    Continue
                </button>
            </form>

            <p class="mt-6 text-xs text-gray-500 dark:text-gray-400">
                Signed in as {{ user.email }}.
            </p>
        </div>
    </div>
</div>
{% endblock %}
