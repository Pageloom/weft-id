name: Lead Agent (Ollama Cloud)

# Runs the /lead workflow autonomously against an Ollama Cloud model, with no
# Claude Code. The orchestrator (.github/scripts/lead_agent.py) drives the model
# through a tool-calling loop: for each iteration in specs/<slug>.md
# it spawns a dev agent, runs the quality gate (`make check && make test`), spawns
# a test agent, triages via a lead agent, and commits. After the last iteration it
# runs the final review pass, pushes, and opens a PR.
#
# Setup (one-time):
#   1. Add a repository secret:
#        OLLAMA_API_KEY   - from https://ollama.com/settings/keys
#   2. Push the branch you want the agent to work on (e.g. oidc-upstream).
#   3. Run: Actions > "Lead Agent (Ollama Cloud)" > Run workflow, selecting the
#      branch and slug.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to work on (must exist on the remote)'
        required: true
        default: 'oidc-upstream'
      slug:
        description: 'Spec file slug (e.g. oidc_upstream, maps to specs/<slug>.md)'
        required: true
        default: 'oidc_upstream'
      model:
        description: 'Ollama Cloud model'
        required: false
        default: 'deepseek-v4-pro:0813'

permissions:
  contents: write
  pull-requests: write

jobs:
  lead:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
      maildev:
        image: maildev/maildev
        ports:
          - 1025:1025
          - 1080:1080

    env:
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_MODEL: ${{ inputs.model }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxmlsec1-dev libxmlsec1-openssl pkg-config

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install Python dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
        run: poetry run python db-init/migrate.py

      - name: Configure git identity
        run: |
          git config user.name "weftid-agent"
          git config user.email "agent@weftid.local"

      - name: Run /lead orchestrator
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
          MEMCACHED_HOST: localhost
        run: |
          python3 .github/scripts/lead_agent.py "${{ inputs.slug }}" \
            --branch "${{ inputs.branch }}" \
            --push

      - name: Open PR
        run: |
          gh pr create --base main --head "${{ inputs.branch }}" \
            --title "Automated /lead run: ${{ inputs.slug }}" \
            --body "Generated by the /lead orchestrator on Ollama Cloud (model: ${{ inputs.model }})." \
            || echo "PR already exists or could not be created"
