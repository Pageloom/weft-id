{% extends "base.html" %}

{% block title %}Signed Out - {{ site_title }}{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-md">
        <div id="logout-done" class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-8 text-center">
            <h1 class="text-2xl font-semibold mb-4 text-gray-900 dark:text-gray-100">You have signed out</h1>
            <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">Your session has ended. You can close this window.</p>
            <a href="/login" class="text-blue-600 dark:text-blue-400 hover:underline">Sign in again</a>
        </div>
    </div>
</div>
{% endblock %}
