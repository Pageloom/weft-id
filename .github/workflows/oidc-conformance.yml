name: OIDC Conformance

# Runs the OpenID Foundation conformance suite against WeftID's OpenID
# Provider (Basic, Config, Form Post, RP-Initiated, and Front-Channel OP plans).
# Same triggers as the E2E workflow; a separate workflow so a conformance
# failure is never mistaken for an E2E failure. The job drives the same
# scripts as a local run (dev/oidc-conformance.sh, dev/oidc_conformance.py); see
# dev/oidc-conformance.md and docs/conformance/oidc.md.

on:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Suite runtime (compose file, Mongo data, downloaded runner scripts,
  # rendered config with client secrets) stays outside the checkout.
  OIDC_CONFORMANCE_DIR: ${{ github.workspace }}/../oidc-conformance-runtime

jobs:
  check-activity:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          COUNT=$(gh api "repos/${{ github.repository }}/commits?since=$SINCE" --jq 'length')
          echo "should_run=$( [ "$COUNT" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # No remove-label job: the E2E workflow removes the shared `run-e2e` label.
  # A second remover would race it and fail on the 404.
  conformance:
    needs: [check-activity]
    if: |
      always()
      && (
        (github.event_name == 'pull_request' && github.event.label.name == 'run-e2e')
        || (github.event_name == 'schedule' && needs.check-activity.outputs.should_run == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Create .env from dev example
        run: |
          cp dev/.env.example .env
          sed -i 's/^BYPASS_OTP=false/BYPASS_OTP=true/' .env

      - name: Build Tailwind CSS
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          ./tailwindcss-linux-x64 --config dev/tailwind.config.js -i static/css/input.css -o static/css/output.css --minify

      - name: Generate self-signed TLS certificates
        run: |
          mkdir -p .devcerts
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout .devcerts/dev.key \
            -out .devcerts/dev.crt \
            -days 1 \
            -subj '/CN=weftid.localhost' \
            -addext 'subjectAltName=DNS:weftid.localhost,DNS:*.weftid.localhost'

      # localhost.emobix.co.uk resolves to 127.0.0.1 in public DNS; pinning it
      # here keeps the run independent of that record.
      - name: Add /etc/hosts entries
        run: |
          echo "127.0.0.1 weftid.localhost dev.weftid.localhost localhost.emobix.co.uk" \
            | sudo tee -a /etc/hosts

      - name: Start Docker Compose services
        run: docker compose --project-directory . -f dev/docker-compose.yml up --build -d app worker db reverse-proxy maildev migrate memcached

      - name: Wait for services to be ready
        run: |
          echo "Waiting for app to be reachable via nginx..."
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null -w '%{http_code}' https://dev.weftid.localhost/login 2>/dev/null | grep -q '200'; then
              echo "App is ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for app"
          docker compose --project-directory . -f dev/docker-compose.yml logs --tail=50
          exit 1

      - name: Start the conformance suite
        run: ./dev/oidc-conformance.sh up

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The runner is stdlib-only; the suite's run-test-plan.py needs these
      # two. Versions match poetry.lock, so no Poetry install is needed.
      - name: Install runner dependencies
        run: pip install httpx==0.28.1 pyparsing==3.3.1

      - name: Run conformance plans
        run: python dev/oidc_conformance.py run --verbose

      - name: Results report
        if: always()
        run: |
          if python dev/oidc_conformance_report.py > dev/oidc-conformance/export/report.md; then
            cat dev/oidc-conformance/export/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No conformance results were exported." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oidc-conformance-results
          path: dev/oidc-conformance/export/
          if-no-files-found: warn

      - name: Service logs
        if: failure()
        run: |
          docker compose --project-directory . -f dev/docker-compose.yml logs --tail=200
          docker logs --tail=200 weft_oidc_conformance_server || true

      - name: Stop services
        if: always()
        run: |
          ./dev/oidc-conformance.sh down || true
          docker compose --project-directory . -f dev/docker-compose.yml down
