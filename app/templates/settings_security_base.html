{% extends "base.html" %}

{% block title %}Security - {{ site_title }}{% endblock %}

{% block content %}
<div class="max-w-4xl">
    {% if success %}
    <div class="mb-6 p-4 border border-green-300 dark:border-green-700 bg-green-50 dark:bg-green-900/20 rounded-md">
        <p class="text-sm text-green-800 dark:text-green-300">
            Security settings updated.
        </p>
    </div>
    {% endif %}

    {% if error %}
    <div class="mb-6 p-4 border border-red-300 dark:border-red-700 bg-red-50 dark:bg-red-900/20 rounded-md">
        <p class="text-sm text-red-800 dark:text-red-300">
            Failed to update settings. Try again.
        </p>
    </div>
    {% endif %}

    {% block tab_content %}{% endblock %}
</div>
{% endblock %}
